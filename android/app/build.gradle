plugins {
    id 'com.android.application'
}

// Release signing (docs/RELEASE_PIPELINE.md): the key in the keystore file RF_KEYSTORE names, with RF_KEYSTORE_PASSWORD,
// RF_KEY_ALIAS and RF_KEY_PASSWORD, as the GitHub release workflow sets them from the repository's secrets. Without RF_KEYSTORE
// the release is signed with the debug key, as before.
def rfKeystore = providers.environmentVariable('RF_KEYSTORE').orNull

// Native code is the root CMake tree; SDL's Java glue comes straight from the pinned SDL checkout.
android {
    namespace 'dev.raveform.game'
    compileSdk 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'dev.raveform.game'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.9.0'  // (CMakeLists.txt's project VERSION, shown on the title screen with the build's date)
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // Oboe's prefab package is a shared library built against c++_shared.
                arguments '-DANDROID_STL=c++_shared'
                abiFilters 'arm64-v8a'
            }
        }
    }

    signingConfigs {
        if (rfKeystore) {
            release {
                storeFile file(rfKeystore)
                storePassword providers.environmentVariable('RF_KEYSTORE_PASSWORD').orNull
                keyAlias providers.environmentVariable('RF_KEY_ALIAS').orNull
                keyPassword providers.environmentVariable('RF_KEY_PASSWORD').orNull
            }
        }
    }

    buildTypes {
        // Native Debug build.
        debug {
            debuggable true
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Debug'
                }
            }
        }
        // Everyday and benchmark build: optimized native code, still debuggable and debug-signed.
        dev {
            debuggable true
            signingConfig signingConfigs.debug
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
        // M7 (release preparation): native Release, not debuggable, no app arguments (RaveformActivity), the native
        // libraries stripped (scripts/build-android.ps1 -Config release keeps the unstripped ones beside the APK). Signed with
        // the key RF_KEYSTORE names when it is set (above), else the debug key: the release key and the store's signing are the
        // owner's.
        release {
            debuggable false
            minifyEnabled false
            signingConfig rfKeystore ? signingConfigs.release : signingConfigs.debug
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../../third_party/SDL/android-project/app/src/main/java']
        }
    }

    buildFeatures {
        prefab true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.oboe:oboe:1.11.0'
    implementation 'androidx.games:games-frame-pacing:2.1.3'
}
